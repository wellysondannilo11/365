services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: robobet
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"],interval: 5s,timeout: 5s,retries: 20}
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  ml:
    build: ./ml
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ROBO_API_KEY: ${ROBO_API_KEY:-}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:?THE_ODDS_API_KEY must be set}
      THE_ODDS_API_SPORT_KEY: ${THE_ODDS_API_SPORT_KEY:-soccer_brazil_serie_a}
      THE_ODDS_API_REGIONS: ${THE_ODDS_API_REGIONS:-eu}
      THE_ODDS_API_MARKETS: ${THE_ODDS_API_MARKETS:-h2h,spreads,totals}
      THE_ODDS_API_ENABLE_SCORES: ${THE_ODDS_API_ENABLE_SCORES:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SENT_IDS_PATH: ${TELEGRAM_SENT_IDS_PATH:-artifacts/paper_trading/telegram_sent_ids.jsonl}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8001:8001"]
  backend:
    build: ./backend
    depends_on: [ml]
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports: ["3000:80"]
    depends_on: [backend]
volumes: {pgdata: {}}
